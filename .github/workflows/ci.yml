name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - 'dev-*'
      - 'feature-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Repository verification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository without retained credentials
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Run lightweight repository gates
        run: >-
          MAX_FILE_BYTES=1048576 make
          check-canonical check-privacy check-shell check-markdown check-file-sizes
