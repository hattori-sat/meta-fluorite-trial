[agents]
max_threads = 4
max_depth = 1

# Domain MCPs are disabled for the primary task by default. Each custom agent
# enables exactly its own server in `.codex/agents/*.toml`.
[mcp_servers.agl]
command = "bash"
args = ["scripts/run-remote-mcp.sh", "agl"]
cwd = ".."
env = { PYTHONDONTWRITEBYTECODE = "1" }
enabled = false
enabled_tools = ["get_manifest_catalog", "search_integration_points", "read_integration_evidence"]
default_tools_approval_mode = "auto"

[mcp_servers.yocto]
command = "bash"
args = ["scripts/run-remote-mcp.sh", "yocto"]
cwd = ".."
env = { PYTHONDONTWRITEBYTECODE = "1" }
enabled = false
enabled_tools = ["list_layer_metadata", "find_recipe_candidates", "search_metadata", "read_metadata", "list_task_logs", "tail_task_log"]
default_tools_approval_mode = "auto"

[mcp_servers.fluorite]
command = "bash"
args = ["scripts/run-mcp.sh", "fluorite"]
cwd = ".."
env = { PYTHONDONTWRITEBYTECODE = "1" }
enabled = false
enabled_tools = ["catalog_scene_assets", "search_scene_contract", "read_scene_source"]
default_tools_approval_mode = "auto"

