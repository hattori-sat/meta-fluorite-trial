[mcp_servers.target_validation]
command = "bash"
args = ["scripts/run-mcp.sh", "target_validation"]
cwd = ".."
env = { PYTHONDONTWRITEBYTECODE = "1" }
enabled = false
enabled_tools = ["list_validation_bundles", "summarize_boot_evidence", "summarize_graphics_evidence", "read_target_evidence"]
default_tools_approval_mode = "auto"

[mcp_servers.command_runner]
command = "bash"
args = ["scripts/run-remote-mcp.sh", "command_runner"]
cwd = ".."
env = { PYTHONDONTWRITEBYTECODE = "1" }
enabled = false
enabled_tools = ["list_runbooks", "describe_runbook", "plan_runbook", "execute_runbook", "start_runbook", "get_run_status", "cancel_run", "read_run_log"]
default_tools_approval_mode = "auto"

[mcp_servers.command_runner.tools.execute_runbook]
approval_mode = "prompt"

[mcp_servers.command_runner.tools.start_runbook]
approval_mode = "prompt"

[mcp_servers.command_runner.tools.cancel_run]
approval_mode = "prompt"
