# meta-fluorite-trial
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-fluorite-trial"
BBFILE_PATTERN_meta-fluorite-trial = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-fluorite-trial = "90"

LAYERSERIES_COMPAT_meta-fluorite-trial = "scarthgap"

# GNU tar 1.34 under pseudo 1.9.0 can lose relative directory ownership
# during package.bbclass' tar pipeline on the Mini PC build host.
PATH:prepend = "${LAYERDIR}/native-tools:"
